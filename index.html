<!DOCTYPE html>
<html>
<head>
    <!-- Farhaad Shakil -->
    <meta charset="UTF-8">
    <title>Farhaad Shakil - Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Two Player Tic Tac Toe</h1>
    <h3>Farhaad Shakil</h3>

    <div id="login">
        <input id="nameInput" placeholder="First Name">

        <input id="passwordInput"
               type="password"
               placeholder="Password">

        <button id="joinBtn">Join Game</button>
    </div>

   
    <div id="role"></div>


    <div id="status">Turn: X</div>

  
    <canvas id="board"
            width="600"
            height="600"></canvas>

    <button id="resetBtn">Reset Game</button>

    <script src="client.js"></script>

</body>
</html>
